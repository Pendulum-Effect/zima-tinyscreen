; Tiny Screen firmware — supports boards 0/1/2, see main.cpp's BOARD_PROFILES
;
; TWO build environments, both compiling the exact same src/main.cpp, that
; differ in exactly one respect: ARDUINO_USB_CDC_ON_BOOT. This is a
; build-time flag, not something runtime config can change, so a board
; needing the opposite setting needs an entirely separate compiled binary:
;   - bridge: boards with a USB-UART bridge chip (CH343P etc) -- board 0
;   - native: boards using the ESP32-S3's native USB peripheral -- boards 1 & 2
;
; `pio run` (no -e flag) builds BOTH environments. CI copies both sets of
; binaries into webflasher/firmware/{bridge,native}/ -- see
; .github/workflows/docker-build-push.yml and webflasher/manifest-*.json.
;
; Build:  pio run
; Flash:  pio run -e esp32-s3-tinyscreen-bridge -t upload   (or -native)

[common]
; PLATFORM MIGRATION (1.0.2): the official `espressif32` PlatformIO
; platform is frozen on Arduino core 2.x, and Arduino_GFX 1.6.x
; references esp32-hal-periman.h -- a header that only exists in core
; 3.x (this is the same incompatibility that forced the old exact pin
; to 1.4.9; see github.com/moononournation/Arduino_GFX/issues/552).
; The AMOLED-1.64 (board 2) needs Arduino_GFX >= 1.6.0 for its CO5300
; QSPI driver -- 1.6.0's release notes add this exact board -- so the
; project moves to the pioarduino platform fork, which ships current
; Arduino core 3.x and is the community-maintained successor for
; PlatformIO ESP32 builds. The firmware already handles both cores
; (see the ESP_ARDUINO_VERSION_MAJOR LEDC shim in main.cpp), and the
; Arduino IDE path was on core 3.x all along, so this CONVERGES the
; two build routes rather than forking them.
; Pinned to a release tag, same philosophy as the exact lib pins:
; builds must not change under us.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Arduino_GFX pinned EXACT (not a floating range), as always: 1.6.6 is
; the first pin with everything board 2 needs -- Arduino_ESP32QSPI,
; Arduino_CO5300 (added 1.6.0 for the AMOLED-1.64 specifically), the
; Arduino_Canvas rotation parameter (the CO5300 cannot hardware-rotate,
; so 90/270 mounts rotate in the canvas at flush time), and the 1.6.5
; fix for building against current core 3.3.x.
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.6
    bblanchon/ArduinoJson @ ^7.0.4

[env:esp32-s3-tinyscreen-bridge]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = ${common.lib_deps}
; Board 0: USB-UART bridge chip (CH343P), NOT native USB-CDC.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:esp32-s3-tinyscreen-native]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = ${common.lib_deps}
; Boards 1 & 2: native USB peripheral, no bridge chip -- opposite setting.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
